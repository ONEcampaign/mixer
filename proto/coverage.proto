syntax = "proto3";
package datacommons;

option go_package = "github.com/datacommonsorg/mixer/internal/proto";

// DateRange holds the earliest and latest observed date for a coverage key.
message DateRange {
  string earliest = 1;
  string latest = 2;
}

// EntityRanges maps entity dcids to their date range for a given variable.
message EntityRanges {
  map<string, DateRange> entity = 1; // entityDcid -> range
}

// VariableCoverageRequest specifies the variables (and optionally entities) to
// look up in the precomputed coverage map.
message VariableCoverageRequest {
  repeated string variables = 1;
  repeated string entities = 2;
}

// VariableCoverageResponse contains the variable-level envelope and, when
// entities were requested, the per-(variable,entity) date ranges.
// Absent variables and absent {entity,variable} pairs are omitted.
message VariableCoverageResponse {
  map<string, DateRange> variable_coverage = 1;   // varDcid -> envelope
  map<string, EntityRanges> entity_coverage = 2;  // varDcid -> {entityDcid -> range}
}
